name: Render and Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow this workflow to push to the gh-pages branch
permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    # Skip on forks — only the main class repo should publish the live site.
    if: github.repository == 'ninanorgren/raukr-awesome-website'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render and publish to gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
